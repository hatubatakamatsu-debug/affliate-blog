name: 毎日記事自動生成

on:
  schedule:
    # 毎朝9時（日本時間）= UTC 0時
    - cron: "0 0 * * *"
  # 手動実行も可能
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # drafts/ へのコミットに必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install anthropic

      - name: 記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_article.py

      - name: 生成した下書きをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/
          # 新しいファイルがなければスキップ
          git diff --cached --quiet || git commit -m "chore: 記事下書き自動生成 $(date +'%Y-%m-%d')"
          git push
